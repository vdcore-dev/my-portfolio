<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      if (!window.location.hash && window.scrollY > 0) {
        window.scrollTo(0, 0);
      }
    </script>

    <!-- 1. Core Identity & SEO Meta Tags -->
    <title>VDCore | Portfolio</title>
    <meta name="title" content="VDCore | Software Engineer" />
    <meta name="description" content="Software Engineer focused on scalable Java microservices, cloud infrastructure, and resilient distributed architectures." />
    <meta name="author" content="VDCore" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://vdcore.com" />

    <!-- 2. System Theme & Colors -->
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />

    <!-- 3. Favicon & Web App Manifest -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- 4. Open Graph / Social Sharing (Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vdcore.com" />
    <meta property="og:title" content="VDCore | Software Engineer" />
    <meta property="og:description" content="Building scalable backends, resilient distributed architectures, and cloud platforms." />
    <meta property="og:image" content="https://vdcore.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://vdcore.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VDCore - Software Engineer Portfolio" />
    <meta property="og:site_name" content="VDCore Portfolio" />
    <meta property="og:locale" content="en_US" />

    <!-- 5. Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://vdcore.com" />
    <meta name="twitter:title" content="VDCore | Software Engineer" />
    <meta name="twitter:description" content="Building scalable backends, resilient distributed architectures, and cloud platforms." />
    <meta name="twitter:image" content="https://vdcore.com/og-image.png" />

    <!-- 6. Schema.org Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "VDCore",
        "jobTitle": "Software Engineer",
        "description": "Specialized in backend architecture, Java microservices, and resilient cloud systems.",
        "url": "https://vdcore.com",
        "knowsAbout": [
          "Java",
          "Spring Boot",
          "Microservices",
          "Docker",
          "PostgreSQL",
          "Redis",
          "Distributed Systems"
        ]
      }
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
